name: Release
on:
  push:
    tags: ['**']
permissions:
  contents: read
concurrency: release
jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      VERSION: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        run: python3 scripts/check-release-tag.py
      - run: swift test --jobs 4
      - name: Publish package source release
        run: |
          git for-each-ref --format='%(contents)' "refs/tags/$VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
