name: Swift tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: swift --version
      - run: swift test --jobs 4
